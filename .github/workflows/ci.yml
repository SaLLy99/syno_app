name: Backend CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      # Start a PostgreSQL container to run tests against
      postgres:
        image: postgres:13
        env:
          POSTGRES_USER: syno
          POSTGRES_PASSWORD: synopass
          POSTGRES_DB: syno_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python 3.11
      uses: actions/setup-python@v3
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt
        # If you have a separate file for test dependencies, you can install it here
        # pip install -r backend/requirements-dev.txt

    - name: Run tests
      # We use the test DB for integration tests, but unit tests will use in-memory
      # The override in conftest.py ensures API tests use the in-memory DB
      working-directory: ./backend
      run: pytest .
