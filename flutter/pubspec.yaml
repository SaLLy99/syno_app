name: syno_app
description: "Uncover your cosmic connection with SYNO, the astrology-enhanced AI dating app that helps you find your fated match through a blend of celestial insights and intelligent behavioral analysis."
publish_to: "none"
version: 1.0.0

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.1.0
  flutter_riverpod: ^3.0.0
  go_router: ^17.0.0
  shared_preferences: ^2.0.0
  intl: 0.20.2
  uuid: ^4.0.0
  easy_localization: ^3.0.3
  flutter_dotenv: ^6.0.0
  dropdown_search: ^6.0.2  
  image_picker: ^1.0.0 
  camera: ^0.11.0 
  dio: ^5.4.0
  flutter_typeahead: ^5.2.0
  flutter_otp_text_field: ^1.5.1+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/icons/
    - assets/lang/
    - assets/env/

flutter_launcher_icons:
  android: "launcher_icon" # Use a specific name for the icon
  ios: false
  image_path: "assets/icons/dreamflow_icon.jpg"
  adaptive_icon_background: "#1E002B" 
  adaptive_icon_foreground: "assets/icons/dreamflow_icon.jpg" 
  windows:
    generate: true
    image_path: "assets/icons/dreamflow_icon.jpg"
    icon_size: 48
  macos:
    generate: true
    image_path: "assets/icons/dreamflow_icon.jpg"
